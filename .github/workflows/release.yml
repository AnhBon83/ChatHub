# Tự build và phát hành phiên bản mới. Hai cách kích hoạt:
#  1. Trên GitHub: tab Actions -> Release -> Run workflow (số phiên bản lấy từ package.json).
#  2. Đẩy tag: git tag v1.0.1 && git push origin v1.0.1
# Mọi file .exe/.AppImage trên trang Releases đều được build ở đây, công khai, từ đúng mã nguồn.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win nsis portable
          - os: ubuntu-latest
            target: --linux AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx electron-builder ${{ matrix.target }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.AppImage

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Tạo mã SHA256
        run: cd out && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Xác định phiên bản
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then TAG="$GITHUB_REF_NAME"; else TAG="v$(node -p "require('./package.json').version")"; fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
          echo "Phát hành $TAG"
      - name: Lấy ghi chú phiên bản từ CHANGELOG.md
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" {on=1; next}
            on && /^## \[/ {exit}
            on && /^\[/ {exit}
            on {print}
          ' CHANGELOG.md > notes.md
          {
            echo
            echo "---"
            echo "**Tải file nào?** Windows: \`ChatHub-Portable-$VERSION.exe\` (không cần cài, không cần admin) hoặc \`ChatHub-Setup-$VERSION.exe\`. Linux: \`ChatHub-$VERSION.AppImage\`."
            echo
            echo "Lần đầu mở trên Windows nếu có cảnh báo SmartScreen: **More info → Run anyway**. Kiểm tra file bằng \`SHA256SUMS.txt\`."
          } >> notes.md
          cat notes.md
      - name: Phát hành
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Phiên bản $TAG đã tồn tại. Hãy tăng version trong package.json và thêm mục mới vào CHANGELOG.md."
            exit 1
          fi
          gh release create "$TAG" out/* \
            --target "$GITHUB_SHA" \
            --title "ChatHub $TAG" \
            --notes-file notes.md
